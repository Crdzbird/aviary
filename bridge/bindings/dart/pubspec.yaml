name: aviary_dart
description: "Embeddable ledger engine for Dart: signed app records with proofs, instant BFT finality, transfers, light clients, P2P consensus, key custody and Ethereum, Bitcoin, Solana interop."
version: 1.1.1
homepage: https://github.com/Crdzbird/aviary
repository: https://github.com/Crdzbird/aviary
documentation: https://github.com/Crdzbird/aviary/blob/main/bridge/bindings/dart/README.md
topics:
  - blockchain
  - ffi
  - consensus
  - ledger
  - web3
platforms:
  linux:
  macos:
  web:
environment:
  sdk: ^3.10.0
dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.2.0
dev_dependencies:
  lints: ^6.0.0
  test: ^1.33.0
# A Flutter web app serves the WebAssembly engine from these assets; the
# web library loads it from assets/packages/aviary_dart/native/web/.
flutter:
  assets:
    - native/web/
