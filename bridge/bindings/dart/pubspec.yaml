name: aviary_dart
description: "Dart API of the Aviary ledger over dart:ffi: BFT finality, composable chains, application records, subchains, light clients and chain trees."
version: 1.0.0
homepage: https://github.com/Crdzbird/aviary
repository: https://github.com/Crdzbird/aviary
documentation: https://github.com/Crdzbird/aviary/blob/main/bridge/bindings/dart/README.md
topics:
  - blockchain
  - ffi
  - consensus
  - ledger
  - web3
platforms:
  linux:
  macos:
  web:
environment:
  sdk: ^3.10.0
dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  hooks: ^2.2.0
dev_dependencies:
  lints: ^5.0.0
  test: ^1.33.0
# A Flutter web app serves the WebAssembly engine from these assets; the
# web library loads it from assets/packages/aviary_dart/native/web/.
flutter:
  assets:
    - native/web/
