name: aviary_lite
description: "Aviary ledger for Flutter with the CipherBird engine bundled: BFT finality, composable chains, application records, subchains and light clients."
version: 0.1.0
homepage: https://github.com/Crdzbird/aviary
repository: https://github.com/Crdzbird/aviary
documentation: https://github.com/Crdzbird/aviary/blob/main/bridge/bindings/aviary_lite/README.md
topics:
  - blockchain
  - ffi
  - consensus
  - ledger
  - web3

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.1.3
  aviary_dart: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
