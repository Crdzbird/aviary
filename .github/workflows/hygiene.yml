name: Hygiene

on:
  push:
    branches: [main]
  pull_request:

jobs:
  repository:
    name: Repository rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Every tracked text file is plain ASCII: no em dashes, arrows, box
      # drawing, check marks or other symbols in code, docs or scripts.
      - name: Plain ASCII in tracked text
        run: |
          bad="$(git ls-files -z | xargs -0 grep -lIP '[^\x00-\x7F]' || true)"
          if [ -n "$bad" ]; then echo "non-ASCII characters in:"; echo "$bad"; exit 1; fi
      # The C ABI header is copied into every shipped xcframework; the copies
      # must match the source header.
      - name: C ABI header copies in sync
        run: |
          n="$(git ls-files | grep 'aviary_c\.h$' | xargs md5sum | awk '{print $1}' | sort -u | wc -l)"
          if [ "$n" != "1" ]; then git ls-files | grep 'aviary_c\.h$' | xargs md5sum; exit 1; fi
