name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout aviary
        uses: actions/checkout@v4
        with:
          path: aviary

      # CipherBird (the cryptolib repo) is what aviary links against; CRYPTOLIB_REPO
      # can point at a fork. This builds its C ABI.
      - name: Checkout cryptolib
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.CRYPTOLIB_REPO || 'Crdzbird/CipherBird' }}
          path: cryptolib

      - name: Install native deps
        run: brew install cmake ninja libsodium liboqs blake3 openssl@3 secp256k1 go

      # blst is not a Homebrew formula; CipherBird's own CI builds it the same way.
      - name: Build blst from source
        run: |
          git clone --depth 1 https://github.com/supranational/blst.git /tmp/blst
          (cd /tmp/blst && ./build.sh)
          sudo cp /tmp/blst/libblst.a /opt/homebrew/lib/
          sudo mkdir -p /opt/homebrew/include/blst
          sudo cp /tmp/blst/bindings/blst.h /tmp/blst/bindings/blst_aux.h /opt/homebrew/include/blst/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The JVM binding uses the foreign function and memory API, final since
      # Java 22; the runner's default JDK still treats it as a preview.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'

      - name: Build cryptolib C ABI
        working-directory: cryptolib
        run: |
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/release --target cryptolib_c

      - name: Run aviary CI
        working-directory: aviary
        env:
          CRYPTOLIB_ROOT: ${{ github.workspace }}/cryptolib
        run: bash scripts/ci.sh
