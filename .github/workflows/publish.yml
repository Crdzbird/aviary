name: Publish to pub.dev

# Automated publishing (https://dart.dev/tools/pub/automated-publishing).
# On pub.dev, each package's admin enables GitHub Actions publishing from
# Crdzbird/aviary with these tag patterns:
#   aviary_dart-v{{version}}   aviary_lite-v{{version}}   aviary-v{{version}}
# Pushing a matching tag publishes that package; the version in its
# pubspec.yaml must equal the tag's version. Publish aviary_dart first and
# wait for it to appear before tagging the Flutter packages, which pin it.

on:
  push:
    tags:
      - 'aviary_dart-v[0-9]+.[0-9]+.[0-9]+*'
      - 'aviary_lite-v[0-9]+.[0-9]+.[0-9]+*'
      - 'aviary-v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the package from the tag
        id: pkg
        run: |
          case "${GITHUB_REF_NAME}" in
            aviary_dart-v*) echo "dir=bridge/bindings/dart" >> "$GITHUB_OUTPUT"; echo "tool=dart" >> "$GITHUB_OUTPUT";;
            aviary_lite-v*) echo "dir=bridge/bindings/aviary_lite" >> "$GITHUB_OUTPUT"; echo "tool=flutter" >> "$GITHUB_OUTPUT";;
            aviary-v*) echo "dir=bridge/bindings/aviary" >> "$GITHUB_OUTPUT"; echo "tool=flutter" >> "$GITHUB_OUTPUT";;
            *) echo "unexpected tag ${GITHUB_REF_NAME}"; exit 1;;
          esac
          echo "version=${GITHUB_REF_NAME##*-v}" >> "$GITHUB_OUTPUT"

      # setup-dart exchanges the GitHub OIDC token for a pub.dev token and
      # stores it in the pub config, which the Flutter SDK's pub shares.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        if: steps.pkg.outputs.tool == 'flutter'
        with:
          channel: stable

      - name: Check the pubspec version against the tag
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: |
          v=$(sed -n 's/^version: *//p' pubspec.yaml)
          [ "$v" = "${{ steps.pkg.outputs.version }}" ] || { echo "pubspec version $v does not match tag version ${{ steps.pkg.outputs.version }}"; exit 1; }
          rm -f pubspec_overrides.yaml

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: ${{ steps.pkg.outputs.tool }} pub publish --force
