name: Native Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/native-linux.yml
      - scripts/linux/**
      - CMakeLists.txt
      - VERSION
      - src/**
      - include/**
      - bridge/aviary_c.h
      - bridge/aviary_c.cpp
      - bridge/bindings/dart/hook/**
      - bridge/bindings/dart/lib/src/core/loader.dart

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            slot: linux-x64
          - runner: ubuntu-24.04-arm
            slot: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout aviary
        uses: actions/checkout@v4
        with:
          path: aviary

      - name: Checkout CipherBird
        uses: actions/checkout@v4
        with:
          repository: Crdzbird/CipherBird
          # The shipped Linux engines are built from a released CipherBird, so a
          # rebuild of the same Aviary commit yields the same engine. Move this
          # tag together with the cipherbird constraint in bridge/bindings/aviary.
          ref: v1.3.0
          path: cryptolib

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build git pkg-config build-essential ca-certificates libssl-dev lld

      # Ubuntu's OpenSSL 3.0 lacks AES-256-GCM-SIV, which the sealed mempool
      # needs, so the engine links CipherBird's from-source OpenSSL (3.6, static,
      # position independent). The Linux archive script finds libcrypto through
      # pkg-config, so a one line .pc file points it at that build.
      - name: Build OpenSSL for the engine
        working-directory: cryptolib
        env:
          CFLAGS: -fPIC
        run: |
          bash scripts/build_openssl_nosock.sh
          mkdir -p "$PWD/build/pc"
          printf 'libdir=%s\nName: libcrypto\nDescription: OpenSSL libcrypto\nVersion: 3.6\nLibs: -L${libdir} -lcrypto\n' \
            "$PWD/build/host-deps/openssl-nosock/lib" > "$PWD/build/pc/libcrypto.pc"
          echo "PKG_CONFIG_PATH=$PWD/build/pc" >> "$GITHUB_ENV"
          PKG_CONFIG_PATH="$PWD/build/pc" pkg-config --variable=libdir libcrypto

      # CipherBird 1.3.0 ships libsodium 1.0.22 on every platform it builds;
      # Ubuntu packages 1.0.18. Build the vendored 1.0.22 tarball from the
      # CipherBird tag, position independent and static, into the directory
      # the Linux archive script reads, and publish it through the same
      # pkg-config directory as libcrypto so the script picks it up.
      - name: Build libsodium for the engine
        working-directory: cryptolib
        run: |
          DEPS="$PWD/build/linux-deps"
          mkdir -p "$PWD/build/host-deps"
          tar xzf third_party/android/src/libsodium-1.0.22.tar.gz -C "$PWD/build/host-deps"
          SRC="$(find "$PWD/build/host-deps" -maxdepth 1 -type d -name 'libsodium-*' | head -1)"
          ( cd "$SRC" && CFLAGS="-O2 -fPIC" ./configure --disable-shared --enable-static \
              --disable-dependency-tracking --prefix="$DEPS" > /dev/null && make -j"$(nproc)" install > /dev/null )
          printf 'prefix=%s\nlibdir=${prefix}/lib\nincludedir=${prefix}/include\nName: libsodium\nDescription: libsodium\nVersion: 1.0.22\nLibs: -L${libdir} -lsodium\nCflags: -I${includedir}\n' \
            "$DEPS" > "$PWD/build/pc/libsodium.pc"
          test "$(PKG_CONFIG_PATH="$PWD/build/pc" pkg-config --modversion libsodium)" = 1.0.22
          grep -q '"1.0.22"' "$DEPS/include/sodium/version.h"
          echo "libsodium $(PKG_CONFIG_PATH="$PWD/build/pc" pkg-config --modversion libsodium) at $DEPS/lib/libsodium.a"

      - name: Build the CipherBird static engine
        working-directory: cryptolib
        run: bash scripts/build_static_archive_linux.sh

      - name: Build libaviary_c.so
        working-directory: aviary
        env:
          CRYPTOLIB_ROOT: ${{ github.workspace }}/cryptolib
        run: bash scripts/linux/build_so.sh

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Run the Dart smoke tests through the build hook
        working-directory: aviary/bridge/bindings/dart
        run: |
          dart pub get
          dart test

      - name: Upload the library
        uses: actions/upload-artifact@v4
        with:
          name: aviary-${{ matrix.slot }}
          path: aviary/bridge/bindings/dart/native/${{ matrix.slot }}/libaviary_c.so
          if-no-files-found: error
