name: Fuzz

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/fuzz.yml
      - fuzz/**
      - src/**
      - include/**
      - bridge/aviary_c.h
      - bridge/aviary_c.cpp
      - CMakeLists.txt
  schedule:
    - cron: '17 4 * * 1'

jobs:
  libfuzzer:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout aviary
        uses: actions/checkout@v4
        with:
          path: aviary

      - name: Checkout CipherBird
        uses: actions/checkout@v4
        with:
          repository: Crdzbird/CipherBird
          path: cryptolib

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-rt-18-dev cmake ninja-build git pkg-config build-essential ca-certificates libsodium-dev libssl-dev

      - name: Build OpenSSL for the engine
        working-directory: cryptolib
        env:
          CFLAGS: -fPIC
        run: |
          bash scripts/build_openssl_nosock.sh
          mkdir -p "$PWD/build/pc"
          printf 'libdir=%s\nName: libcrypto\nDescription: OpenSSL libcrypto\nVersion: 3.6\nLibs: -L${libdir} -lcrypto\n' \
            "$PWD/build/host-deps/openssl-nosock/lib" > "$PWD/build/pc/libcrypto.pc"
          echo "PKG_CONFIG_PATH=$PWD/build/pc" >> "$GITHUB_ENV"

      - name: Build the CipherBird static engine
        working-directory: cryptolib
        run: bash scripts/build_static_archive_linux.sh

      - name: Build the fuzz targets
        working-directory: aviary
        run: |
          cmake -S . -B build-fuzz -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DAVIARY_BUILD_FUZZERS=ON -DAVIARY_SANITIZE=ON \
            -DCRYPTOLIB_ROOT="$GITHUB_WORKSPACE/cryptolib" \
            -DCRYPTOLIB_C_INCLUDE_DIR="$GITHUB_WORKSPACE/cryptolib/bridge" \
            -DCRYPTOLIB_C_LIBRARY="$GITHUB_WORKSPACE/cryptolib/build/static/libcryptolib_c.a"
          cmake --build build-fuzz --target fuzz_codec fuzz_restore fuzz_c_abi fuzz_peering

      - name: Run each target for two minutes
        working-directory: aviary
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          for t in fuzz_codec fuzz_restore fuzz_c_abi fuzz_peering; do
            mkdir -p "corpus/$t"
            ./build-fuzz/$t -max_total_time=120 -max_len=16384 -print_final_stats=1 "corpus/$t" fuzz/seeds/peering
          done

      - name: Keep the corpus and any crash
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: |
            aviary/corpus
            aviary/crash-*
            aviary/leak-*
          if-no-files-found: ignore
